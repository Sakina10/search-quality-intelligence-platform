# dbt Project Configuration File
# Google Search Quality Intelligence Platform

name: 'dbt_search_quality'
version: '1.0.0'
config-version: 2

# Profile to use from profiles.yml
profile: 'search_quality_profile'

# Model directory configurations
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Define materializations and schema scopes
models:
  dbt_search_quality:
    # Staging layer materializes light views to avoid physical storage replication
    staging:
      +schema: staging
      +materialized: view
    # Core warehouse layers materialize physical tables optimized for read performance
    core:
      +schema: core
      +materialized: table
