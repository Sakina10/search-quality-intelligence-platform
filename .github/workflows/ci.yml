name: Platform CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libomp-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Code Formatting (Black)
      run: |
        black --check src/ tests/ scripts/

    - name: Execute Code Linting (Ruff)
      run: |
        ruff check src/ tests/ scripts/

    - name: Execute Type Verification (Mypy)
      run: |
        mypy --ignore-missing-imports --explicit-package-bases src/

    - name: Run Automated Test Suites (Pytest)
      run: |
        PYTHONPATH=. pytest tests/ --cov=src --cov-report=xml

    - name: Upload Test Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: test-coverage-report
        path: coverage.xml
        retention-days: 7
