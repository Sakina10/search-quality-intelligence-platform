site_name: Google Search Quality Intelligence Platform
site_url: https://google-search-quality.github.io/intelligence-platform/
site_description: Production-grade analytics engineering and MLOps platform for search quality degradation detection.
site_author: Release Engineering Team

repo_name: google-search-quality/intelligence-platform
repo_url: https://github.com/google-search-quality/intelligence-platform

theme:
  name: material
  palette:
    - scheme: slate
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.def_mermaid
  - tables
  - admonition
  - attr_list

nav:
  - Overview: index.md
  - Architecture: architecture/system_design.md
  - PRD & Requirements: prd/prd.md
  - Portfolio & Case Study:
      - Executive Summary: portfolio/executive_summary.md
      - Architecture Case Study: portfolio/architecture_case_study.md
      - Interview Kit & Trade-offs: portfolio/interview_kit.md
      - One-Page Technical Handout: portfolio/one_page_summary.md
  - Developer Guide:
      - Quickstart: index.md#operational-quickstart
      - Contributing: https://github.com/google-search-quality/intelligence-platform/blob/main/CONTRIBUTING.md
