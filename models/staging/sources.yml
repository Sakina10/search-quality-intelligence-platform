version: 2

sources:
  - name: raw_logs
    database: search_quality
    schema: public
    description: "Raw log events and dimension extractions generated by the platform ingestion layer."
    tables:
      - name: dim_geography
        description: "Raw geography attributes (country, region, languages)."
      - name: dim_systems
        description: "Raw system technical specs (browsers, devices, operating systems)."
      - name: dim_queries
        description: "Raw queries attributes (intent, category, length classification)."
      - name: dim_users
        description: "Raw users profiles (SCD Type 2 records tracking segments and cohorts)."
      - name: fct_search_events
        description: "Raw search clicks and latency metrics events."
