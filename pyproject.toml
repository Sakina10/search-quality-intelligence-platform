[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "search-quality-intelligence-platform"
version = "1.0.0"
description = "Production-grade analytics and MLOps platform predicting Search Quality Score (SQS) degradation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Search Quality Platform Team"}
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E402",
    "E501",
    "N803",
    "N806",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Ignore missing type stubs for untyped third-party libraries
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "pyarrow.*",
    "sqlalchemy.*",
    "psycopg2.*",
    "faker.*",
    "xgboost.*",
    "lightgbm.*",
    "optuna.*",
    "shap.*",
    "evidently.*",
    "feast.*",
    "great_expectations.*",
    "airflow.*"
]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["."]
